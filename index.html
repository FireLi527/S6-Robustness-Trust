<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S6 · Robustness & Trust</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#0b1018;color:#e8eef6}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:24px;padding:18px 28px;border-bottom:1px solid #273343;background:#101823;flex-wrap:wrap}.brand{display:flex;gap:13px;align-items:center}.mark{background:#91d6b9;color:#10251d;font-weight:800;padding:12px;border-radius:12px}h1{font-size:17px;margin:0 0 5px}small{color:#9aabba;font-size:12px}nav{display:flex;gap:8px;margin-left:auto}button,a{font:inherit}button{padding:12px 18px;background:#172332;color:#b4c2d2;border:1px solid #304153;border-radius:9px;cursor:pointer}button[aria-pressed=true],button[aria-selected=true]{color:#b8efda;background:#203a34;border-color:#6eb79b}button:focus-visible,a:focus-visible{outline:2px solid #91d6b9;outline-offset:3px}.context{display:flex;gap:18px;align-items:center;padding:13px 28px;background:#111b27;font-size:13px;flex-wrap:wrap}.context p{margin:0;color:#a9bbce;flex:1}a{color:#a1d6fb;text-decoration:none}.status{font-size:12px;white-space:nowrap}.status[data-state=ready]{color:#91d6b9}.status[data-state=offline],.status[data-state=conflict]{color:#f1ba86}iframe{width:100%;height:calc(100vh - 154px);min-height:620px;border:0;display:block}iframe[hidden]{display:none}#notice{margin:0;padding:16px 28px;background:#422f21;color:#ffe1b3}#notice[hidden]{display:none}@media(max-width:700px){header{padding:16px;gap:15px}nav{margin:0;width:100%}nav button{flex:1}.context{padding:14px 16px}iframe{height:calc(100vh - 210px)}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">S6</span><div><h1>Robustness & Trust</h1><small id="portal-subtitle">安全实验平台</small></div></div>
<nav role="tablist" aria-label="实验模块"><button id="image-tab" role="tab" aria-selected="true" aria-controls="image-frame" data-module="image">图像数据安全</button><button id="prompt-tab" role="tab" aria-selected="false" aria-controls="prompt-frame" data-module="prompt">提示词注入</button></nav><div role="group" aria-label="Language / 语言" style="display:flex;gap:6px"><button id="portal-zh" aria-pressed="true" type="button">中文</button><button id="portal-en" aria-pressed="false" type="button">EN</button></div></header>
<div class="context"><p id="description">数据完整性、标签检测与防御训练</p><span class="status" id="status" role="status">正在检查服务…</span><a id="standalone" href="http://127.0.0.1:8766/" target="_blank" rel="noopener">新窗口打开 ↗</a></div>
<p id="notice" role="alert" hidden></p>
<main><iframe id="image-frame" role="tabpanel" aria-labelledby="image-tab" title="图像数据安全控制台" src="http://127.0.0.1:8766/"></iframe><iframe id="prompt-frame" role="tabpanel" aria-labelledby="prompt-tab" title="提示词注入控制台" hidden></iframe></main>
<script>
const modules={image:{url:'http://127.0.0.1:8766/'},prompt:{url:'http://127.0.0.1:8765/'}};
const copy={zh:{subtitle:'安全实验平台',tabs:'实验模块',image:'图像数据安全',prompt:'提示词注入',imageDescription:'数据完整性、标签检测与防御训练',promptDescription:'内容检测、意图识别与工具权限',standalone:'新窗口打开 ↗',ready:'● 已连接',conflict:'● 端口被其他服务占用',offline:'● 未连接',file:'请双击项目根目录的 start.cmd，使用 http://127.0.0.1:8764/ 统一入口。',conflictNotice:'模块端口被其他程序占用，请检查启动窗口提示。',offlineNotice:'服务未连接，请运行 start.cmd 后刷新。'},en:{subtitle:'Security experiments',tabs:'Experiment modules',image:'Image Data Security',prompt:'Prompt Injection',imageDescription:'Data integrity, label detection, and defense training',promptDescription:'Content detection, intent recognition, and tool permissions',standalone:'Open in new window ↗',ready:'● Connected',conflict:'● Port used by another service',offline:'● Disconnected',file:'Run start.cmd in the project root and open http://127.0.0.1:8764/.',conflictNotice:'Another application is using the module port. Check the startup window.',offlineNotice:'Service disconnected. Run start.cmd and refresh.'}};
let selected='image',health={},language='zh';
try{language=localStorage.getItem('s6-portal-language')==='en'?'en':'zh';}catch(error){}
const get=id=>document.getElementById(id);
function syncFrame(key){const frame=get(key+'-frame');if(frame.getAttribute('src'))frame.contentWindow.postMessage({type:'s6-portal-language',language},new URL(modules[key].url).origin);}
function renderStatus(){const state=health[selected]?.status||'offline',text=copy[language];get('status').dataset.state=state;get('status').textContent=text[state]||text.offline;get('notice').hidden=state==='ready';get('notice').textContent=location.protocol==='file:'?text.file:state==='conflict'?text.conflictNotice:text.offlineNotice;}
function applyLanguage(value){language=value==='en'?'en':'zh';try{localStorage.setItem('s6-portal-language',language);}catch(error){}const text=copy[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';get('portal-subtitle').textContent=text.subtitle;document.querySelector('nav').setAttribute('aria-label',text.tabs);for(const key of Object.keys(modules)){get(key+'-tab').textContent=text[key];get(key+'-frame').title=text[key];syncFrame(key);}get('description').textContent=text[selected+'Description'];get('standalone').textContent=text.standalone;for(const code of ['zh','en'])get('portal-'+code).setAttribute('aria-pressed',String(language===code));renderStatus();}
function select(key){selected=key;for(const name of Object.keys(modules)){get(name+'-tab').setAttribute('aria-selected',String(name===key));get(name+'-tab').tabIndex=name===key?0:-1;get(name+'-frame').hidden=name!==key;}if(!get(key+'-frame').getAttribute('src'))get(key+'-frame').src=modules[key].url;get('description').textContent=copy[language][key+'Description'];get('standalone').href=modules[key].url;syncFrame(key);renderStatus();}
for(const key of Object.keys(modules))get(key+'-frame').addEventListener('load',()=>syncFrame(key));
for(const code of ['zh','en'])get('portal-'+code).addEventListener('click',()=>applyLanguage(code));
for(const button of document.querySelectorAll('[data-module]')){button.addEventListener('click',()=>select(button.dataset.module));button.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const key=event.key==='Home'?'image':event.key==='End'?'prompt':selected==='image'?'prompt':'image';select(key);get(key+'-tab').focus();}});}
async function check(){if(location.protocol==='file:'){renderStatus();return;}try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('status');const next=await r.json();for(const key of Object.keys(modules)){if(next[key]?.status==='ready'&&health[key]?.status!=='ready'&&get(key+'-frame').getAttribute('src'))get(key+'-frame').src=modules[key].url;}health=next;}catch(error){health={};}renderStatus();}
get('prompt-tab').tabIndex=-1;applyLanguage(language);check();setInterval(check,5000);
</script>
</body></html>
